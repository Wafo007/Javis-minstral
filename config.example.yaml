# Operations sur fichiers (tools/fichiers.py) : Jarvis ne touche QUE a ces dossiers.
fichiers:
  racines:   # dossiers ou Jarvis peut creer/modifier des fichiers (« bureau/x.txt », « documents/x.txt »)
    - ~/Documents/Jarvis
    - ~/Desktop
    - ~/OneDrive/Desktop
    - ~/Documents
    - ~/Downloads

# Missions autonomes d'auto-amelioration (core/missions.py) : Jarvis travaille seul dans un workspace git isole.
missions:
  racine: ''                    # vide = %LOCALAPPDATA%/JarvisMissions (Windows) ; base SQLite, workspaces, rapports
  duree_defaut_min: 60          # duree si tu n'en donnes pas ; c'est un PLAFOND, la mission peut finir avant
  duree_max_min: 120            # plafond absolu (jamais depasse, meme si tu demandes plus)
  max_simultanees: 1
  fournisseurs: [mistral, gemini]   # gratuits uniquement ; l'ordre = preference, l'autre sert de secours
  budget_requetes: 400          # appels LLM maximum par mission
  budget_tokens: 1500000
  budget_etapes: 120
  tentatives_par_etape: 3
  max_essais_api: 6             # essais par appel LLM (429 : Retry-After + attente exponentielle avec gigue)
  attente_inline_max_s: 120     # au-dela, la mission passe en WAITING_FOR_QUOTA et reprend seule
  timeout_tests_s: 900
  delai_calendaire_max_h: 24    # une mission en attente de quota n'attend jamais plus longtemps
  # commande_tests: ["python", "-m", "pytest", "-q"]   # remplace la commande de tests par defaut

# Telephone Android pilote depuis le PC par ADB (core/mobile_adb.py, docs/mobile_android.md). Aucune app a installer.
mobile:
  adb_chemin: ''           # vide = « adb » du PATH ; sinon chemin complet de adb.exe (platform-tools)
  appareil: ''             # « ip:port » de connexion du debogage sans fil (vide = le seul appareil branche)
  apps:                    # alias perso : nom dit a voix haute -> nom de paquet Android
    # ma banque: fr.exemple.banque

ghost_protocol:            # mode tactique cinematographique (SIMULATION) ; voir docs/GHOST_PROTOCOL.md
  vitesse: 1.0             # 1 = rythme normal des animations
  elevenlabs:              # reglages propres a la voix Ghost (la cle va dans .env ou ELEVENLABS_API_KEY, pas ici)
    cle: ''                # laisser vide : preferer la variable d'environnement ELEVENLABS_API_KEY
    voix: ''               # ou ELEVENLABS_VOICE_ID
    modele: eleven_flash_v2_5
    langue: fr
  voix:
    max_caracteres: 220    # longueur maximale parlee par reponse (economie de quota)
    quota_mensuel: 0       # plafond LOCAL en caracteres/mois (0 = aucun) ; ne remplace pas le quota reel du compte
    timeout_s: 10
    cache_mo: 50

